# Jarvis configuration. Validated by pydantic-settings (src/jarvis/config.py).
# Environment variables override this file: JARVIS_LLM__MODEL=... etc.
# Secrets (API keys) go in .env, never here.

app:
  log_level: INFO
  log_format: console # console | json

llm:
  backend: anthropic
  model: claude-sonnet-5
  max_tokens: 1024
  temperature: 0.7

persona:
  name: Jarvis
  languages: [en, fr, de, ar]
  # Appended verbatim to the system prompt for per-user tweaks.
  extra_instructions: ""

memory:
  # Short-term buffer size, in messages (a turn is two messages).
  short_term_max_messages: 80

audio:
  input_device: null # null = system default; int index or name string
  output_device: null
  sample_rate: 16000
  frame_ms: 80 # matches openWakeWord's expected 1280-sample chunks
  wake:
    backend: openwakeword
    model: hey_jarvis # pretrained; downloaded on first run
    threshold: 0.6
    refractory_s: 2.0
  vad:
    backend: silero # silero | energy (pure-Python fallback)
    speech_threshold: 0.5
    silence_ms: 800 # trailing quiet that ends an utterance
    no_speech_timeout_ms: 6000 # give up if nothing is said after wake
    max_utterance_ms: 30000
    min_speech_ms: 300

speech:
  stt:
    backend: faster_whisper
    model_size: small # tiny|base|small|medium|large-v3; downloaded on first run
    device: auto # auto = CUDA if available, else CPU
    compute_type: auto # float16 on GPU, int8 on CPU
  tts:
    backend: piper # piper (local) | elevenlabs (cloud, needs API key)
    fallback_to_local: true # cloud failure -> Piper, announced aloud
    piper:
      # Download voices from https://huggingface.co/rhasspy/piper-voices
      # and map them per language. Missing languages use default_language.
      voices:
        en: models/piper/en_US-lessac-medium.onnx
        # fr: models/piper/fr_FR-siwis-medium.onnx
        # de: models/piper/de_DE-thorsten-medium.onnx
        # ar: models/piper/ar_JO-kareem-medium.onnx
      default_language: en
    elevenlabs:
      voice_id: "" # required when backend: elevenlabs
      model_id: eleven_multilingual_v2

tools:
  enabled: [web_search, calendar, smart_home, files]
  files_root: data/files # sandbox for the 'files' tool
  calendar_path: data/calendar.json
  max_tool_iterations: 8 # tool-use rounds allowed per user turn
  # External MCP servers mounted as tools at startup. ${VAR} in url,
  # headers, command, args, and env expands from the environment, so
  # tokens stay in .env. A server that fails to connect is skipped
  # with a warning; Jarvis still starts.
  mcp_servers: []
  # - name: n8n
  #   transport: streamable_http # streamable_http | sse | stdio
  #   url: https://your-instance.n8n.cloud/mcp/your-path
  #   headers:
  #     Authorization: "Bearer ${N8N_MCP_TOKEN}"
  # - name: fs
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/some/dir"]

# Later phases add sections here:
#   rag: (Phase 4) embedding model, vector store path
#   api: (Phase 5) FastAPI host/port
