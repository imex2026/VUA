[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Jarvis - a modular, async, voice-first AI assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "structlog>=24.1",
]

# Heavy, phase-gated extras. Installed on demand so the core stays lean:
#   rag (Phase 4): sentence-transformers, chromadb
#   api (Phase 5): fastapi, uvicorn
[project.optional-dependencies]
audio = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "openwakeword>=0.6",
    "silero-vad>=5.1",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jarvis"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "numpy.*",
    "openwakeword.*",
    "piper.*",
    "silero_vad.*",
    "sounddevice.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
