[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Jarvis - a modular, async, voice-first AI assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "structlog>=24.1",
]

# Heavy, phase-gated extras. Installed on demand so the core stays lean:
#   audio (Phase 2): sounddevice, openwakeword, silero-vad, faster-whisper,
#                    piper-tts
#   rag   (Phase 4): sentence-transformers, chromadb
#   api   (Phase 5): fastapi, uvicorn
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
